services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: qq-napcat
    restart: unless-stopped
    environment:
      NAPCAT_UID: "0"
      NAPCAT_GID: "0"
      WEBUI_TOKEN: "${WEBUI_TOKEN:?set WEBUI_TOKEN in .env}"
      WEBUI_PREFIX: ""
      ACCOUNT: "${QQ_ACCOUNT:?set QQ_ACCOUNT in .env}"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:6099:6099"
      - "${MESH_IP:-127.0.0.1}:6099:6099"
      - "127.0.0.1:3000:3000"
      - "${MESH_IP:-127.0.0.1}:19001:19001"
    volumes:
      - ./napcat/config:/app/napcat/config
      - ./napcat/qq:/app/.config/QQ
      - ./napcat/plugins:/app/napcat/plugins
    shm_size: 256m
    mem_limit: 1200m
    networks:
      - qqbot
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  qqbot:
    driver: bridge
